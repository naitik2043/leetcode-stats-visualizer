<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/assets/js/theme-init.js"></script>
  <meta name="theme-color" content="#090d18"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Set a new password for your LeetMetric account using a secure reset link.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Choose a new password | LeetMetric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/site.css">
</head>
<body><div id="site-header"></div>
<main class="auth-page">
  <section class="auth-story"><div class="page-kicker">SECURE YOUR ACCOUNT</div><h1>A fresh start.<br><span>A stronger key.</span></h1><p>Choose a new password. Reset links are single-use and expire after a short period.</p></section>
  <form class="auth-card" data-auth="reset">
    <h2>Set a new password</h2><p>Enter a new password to finish account recovery.</p><div class="form-status" aria-live="polite"></div>
    <input type="hidden" name="token" id="reset-token">
    <div class="form-field"><label for="new-password">New password</label><div class="password-wrap"><input id="new-password" name="password" type="password" minlength="10" autocomplete="new-password" required><button class="password-toggle" type="button" data-target="new-password">SHOW</button></div><span class="form-help">At least 10 characters, maximum 72 UTF-8 bytes.</span></div>
    <button class="primary-button" type="submit">Update password →</button>
    <div class="form-switch"><a href="/login.html">Return to log in</a></div>
  </form>
</main>
<script>document.getElementById("reset-token").value=new URLSearchParams(location.search).get("token")||"";</script><div id="site-footer"></div>
<script src="/assets/js/site.js" defer></script></body></html>
